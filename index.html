<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Snus Empire">
<meta name="theme-color" content="#5f9e4a">
<title>Snus Empire Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2340; --muted:#7a7290; --gold:#ffc83d; --gold2:#f5a623; --green:#3cc46b; --green2:#2ea158;
  --red:#ff5f6d; --blue:#4aa8ff; --panel:#fff8ec; --line:#eadfcc; --brand:#2f6fed;
  --f:'Baloo 2',system-ui,sans-serif; --noise:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:var(--f);color:var(--ink);overscroll-behavior:none;background:#5f9e4a}
body{display:flex;justify-content:center}
button{font-family:var(--f)}
#app{width:100%;max-width:480px;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:#5f9e4a}

/* ================= HUD ================= */
.hud{position:absolute;top:0;left:0;right:0;z-index:42;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
.hrow{display:flex;gap:6px;align-items:center}
.prof{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border-radius:30px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 rgba(43,35,64,.18),0 6px 14px rgba(43,35,64,.15);flex:1;min-width:0;cursor:pointer}
.av{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.25)}
.av .lvl{position:absolute;bottom:-4px;right:-6px;background:var(--gold2);color:#fff;font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{font-size:11px;color:var(--muted);font-weight:700;line-height:1.1}
.xp{height:7px;border-radius:4px;background:#eee4d2;margin-top:3px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;transition:width .3s}
.res{display:flex;flex-direction:column;gap:4px}
.pill{pointer-events:auto;background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 3px 0 rgba(43,35,64,.18);padding:0 10px;display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;min-width:66px;height:26px}
.money{pointer-events:auto;margin:7px auto 0;width:max-content;max-width:100%;background:linear-gradient(180deg,#3a3052,#2b2340);color:#fff;border-radius:18px;padding:3px 18px 4px;text-align:center;box-shadow:0 4px 0 #17121f,0 8px 16px rgba(0,0,0,.25)}
.money .v{font-size:26px;font-weight:800;line-height:1.05}
.money .s{font-size:13px;color:#7ff0a6;font-weight:700;line-height:1}
.chips{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.chip{pointer-events:auto;background:rgba(255,255,255,.95);border-radius:10px;padding:0 8px;font-weight:800;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:4px;height:22px;cursor:pointer}
.chip .mb{width:38px;height:6px;border-radius:3px;background:#eee4d2;overflow:hidden}
.chip .mb i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff5f6d)}
.chip.tax{color:#d23b4a}
.boostbar{pointer-events:auto;margin:5px auto 0;width:max-content;background:linear-gradient(90deg,#ff7ac6,#ffb347);color:#fff;border-radius:12px;padding:1px 12px;font-weight:800;font-size:12px;display:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.boostbar.on{display:block}

/* ================= Karte (2.5D) ================= */
#world{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:none;overscroll-behavior:contain}
#world::-webkit-scrollbar{display:none}
#map{position:relative}
.lawn{position:absolute;inset:0;background:var(--noise),
  radial-gradient(ellipse 120px 80px at 15% 20%,rgba(255,255,255,.08),transparent 70%),
  radial-gradient(ellipse 160px 90px at 80% 55%,rgba(0,0,0,.07),transparent 70%),
  radial-gradient(ellipse 140px 100px at 30% 85%,rgba(255,255,255,.06),transparent 70%),
  linear-gradient(180deg,#6aab52,#5c9a46)}
.shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(4px)}
.tree{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.35) 0 8%,transparent 26%),
  radial-gradient(circle at 65% 70%,#2c6b2e 0 30%,transparent 55%),
  radial-gradient(circle at 40% 40%,#79c25d,#3e8a3b 62%,#2a6a2c);
  box-shadow:inset -4px -6px 10px rgba(0,0,0,.25)}
.bush{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5e486,#5aae4a 60%,#3f8a39);box-shadow:inset -2px -3px 5px rgba(0,0,0,.2),3px 5px 5px rgba(0,0,0,.2)}
.flower{position:absolute;font-size:11px;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.25))}
.path{position:absolute;background:var(--noise),linear-gradient(180deg,#d6cfc2,#c9c1b2);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.plaque{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#fff,#f1ece3);border-radius:10px;padding:2px 16px 3px;font-weight:800;font-size:17px;white-space:nowrap;box-shadow:0 6px 0 #b9b0a0,0 10px 12px rgba(0,0,0,.25);border-top:4px solid var(--brand);max-width:86%;overflow:hidden;text-overflow:ellipsis}
.parking{position:absolute;background:var(--noise),linear-gradient(180deg,#77747f,#6a6772);border-radius:8px;box-shadow:inset 0 0 0 3px #5e5b66,0 3px 0 #4f4c56}
.parking .spot{position:absolute;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,.85)}
.car{position:absolute;width:20px;height:36px;border-radius:7px 7px 6px 6px;box-shadow:inset 0 10px 0 rgba(160,210,255,.55),inset 0 -9px 0 rgba(0,0,0,.25),inset 2px 0 0 rgba(255,255,255,.3),3px 5px 4px rgba(0,0,0,.35)}
/* Gebäude */
.bld{position:absolute;background:linear-gradient(180deg,#6c6178,#564b63);border-radius:10px;box-shadow:0 16px 0 #362e42,0 22px 26px rgba(0,0,0,.35)}
.corr{position:absolute;background:var(--noise),linear-gradient(90deg,rgba(0,0,0,.08),transparent 20%,transparent 80%,rgba(0,0,0,.08)),#cfc9bf}
.mainbelt{position:absolute;background:repeating-linear-gradient(180deg,#4f4f59 0 3px,#62626e 3px 8px);border-left:4px solid #35353d;border-right:4px solid #35353d;box-shadow:3px 0 4px rgba(0,0,0,.3);animation:beltY .4s linear infinite}
@keyframes beltY{to{background-position:0 8px}}
.room{position:absolute;border-radius:3px;overflow:hidden;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.room .fl{position:absolute;inset:0}
.room .ao{position:absolute;inset:0;box-shadow:inset 0 14px 10px -8px rgba(0,0,0,.45),inset 8px 0 8px -6px rgba(0,0,0,.25),inset -8px 0 8px -6px rgba(0,0,0,.25);pointer-events:none;z-index:3}
.room .wallf{position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(180deg,#8a7f96,#6e6379);z-index:2}
.room .door{position:absolute;width:6px;height:30px;background:#cfc9bf;z-index:4}
.room .sign{position:absolute;top:15px;left:5px;right:5px;display:flex;justify-content:space-between;gap:4px;z-index:6;pointer-events:none}
.room .nm{background:rgba(255,255,255,.95);border-radius:8px;padding:0 6px;font-weight:800;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74%}
.room .lv{background:#2b2340;color:#fff;border-radius:8px;padding:0 6px;font-weight:700;font-size:11px;white-space:nowrap}
.room .out{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:8px;padding:0 7px;font-weight:800;font-size:12px;z-index:6;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.room .up{position:absolute;top:38px;right:6px;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#52d983,var(--green));color:#fff;font-weight:800;font-size:16px;display:none;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--green2),0 5px 6px rgba(0,0,0,.25);z-index:7;animation:hop 1s ease-in-out infinite}
.room .up.on{display:flex}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.room:active .fl{filter:brightness(1.08)}
/* Maschine 2.5D: Oberseite + Front + Schatten */
.mach{position:absolute;width:42px;height:26px;border-radius:5px;z-index:4;
  background:linear-gradient(180deg,#dfe4ea,#b9c1cc);
  box-shadow:0 11px 0 #707987,0 11px 0 1px rgba(0,0,0,.25),4px 16px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.mach .panel{position:absolute;left:4px;top:4px;width:18px;height:12px;border-radius:2px;background:linear-gradient(180deg,#1e2b3a,#34495e);box-shadow:inset 0 0 3px rgba(80,200,255,.6)}
.mach .panel::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:#5dd8ff;opacity:.8;animation:scan 1.4s linear infinite}
@keyframes scan{0%,100%{opacity:.25}50%{opacity:1}}
.mach .ic{position:absolute;right:2px;top:1px;font-size:15px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.mach .led{position:absolute;left:6px;bottom:-8px;width:5px;height:5px;border-radius:50%;background:#5dff8f;box-shadow:0 0 5px #5dff8f;animation:blink 1.2s infinite;z-index:2}
@keyframes blink{50%{opacity:.25}}
.rbelt{position:absolute;height:11px;background:repeating-linear-gradient(90deg,#4f4f59 0 3px,#62626e 3px 8px);border-top:2px solid #35353d;border-bottom:3px solid #2a2a30;z-index:2;box-shadow:0 3px 3px rgba(0,0,0,.3)}
.rbelt.r{animation:beltR .4s linear infinite}.rbelt.l{animation:beltL .4s linear infinite}
@keyframes beltR{to{background-position:8px 0}}@keyframes beltL{to{background-position:-8px 0}}
.can{position:absolute;width:11px;height:11px;border-radius:50%;z-index:3;--c:#7b4f2c;background:radial-gradient(circle,var(--c) 0 38%,#fff 40% 50%,var(--c) 52% 70%,rgba(0,0,0,.25) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),1px 2px 2px rgba(0,0,0,.45)}
.wk{position:absolute;width:22px;height:22px;z-index:5;left:0;top:0}
.wk i{position:absolute;display:block}
.wk .wsh{left:4px;top:7px;width:20px;height:16px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(2px)}
.wk .bd{left:1px;top:6px;width:20px;height:11px;border-radius:7px 7px 6px 6px;background:linear-gradient(90deg,var(--shirt) 0 26%,#d9f23a 26% 34%,var(--shirt) 34% 66%,#d9f23a 66% 74%,var(--shirt) 74%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.25)}
.wk .arm{top:3px;width:6px;height:9px;border-radius:3px;background:linear-gradient(180deg,var(--skin) 0 45%,var(--shirt) 46%);animation:swing .6s ease-in-out infinite alternate}
.wk .arm.l{left:0}.wk .arm.r{right:0;animation-delay:-.6s}
@keyframes swing{from{transform:translateY(-2px)}to{transform:translateY(3px)}}
.wk.carry .arm{animation:none;transform:translateY(-3px)}
.wk .hd{left:6px;top:5px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.35),transparent 45%),var(--hair);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.3)}
.wk .hd.helm{background:radial-gradient(circle at 40% 30%,#fffbd0,#f5c518 55%,#c99a00);box-shadow:0 0 0 1.5px #c99a00,0 1px 1px rgba(0,0,0,.3)}
.wk .box{left:4px;top:-5px;width:14px;height:10px;border-radius:2px;background:linear-gradient(180deg,#e0ad74,#b57d43);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 4px 0 -3px rgba(255,255,255,.4),1px 3px 3px rgba(0,0,0,.35)}
.wk.cust{z-index:4}
.crate{position:absolute;width:18px;height:18px;border-radius:2px;z-index:3;background:linear-gradient(135deg,#d9a46a,#b57d43);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),inset 0 8px 0 -6px rgba(0,0,0,.15),3px 5px 4px rgba(0,0,0,.35)}
/* gesperrte Grundstücke */
.plot{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;overflow:hidden}
.plot.next{background:var(--noise),repeating-linear-gradient(45deg,#e3c46f 0 14px,#d2b058 14px 28px);box-shadow:inset 0 14px 10px -8px rgba(0,0,0,.35),inset 0 0 0 3px #a8873a}
.plot.lock{background:var(--noise),linear-gradient(180deg,#a99572,#9b8765);box-shadow:inset 0 14px 10px -8px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.12)}
.plot .pn{background:rgba(255,255,255,.95);border-radius:8px;padding:0 7px;font-weight:800;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.plot .pc{font-size:11px;font-weight:700;color:#4f3f22}
.plot .cone{font-size:24px;line-height:1;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.35))}
.plot .btn{min-width:0;padding:3px 10px;font-size:13px}
/* Laderampe & Straße */
.dock{position:absolute;background:var(--noise),linear-gradient(180deg,#bdb6aa,#cfc8bc 40%);border-radius:0 0 8px 8px;box-shadow:0 8px 0 #8e877b,0 12px 14px rgba(0,0,0,.25)}
.dock .bay{position:absolute;top:0;width:4px;height:100%;background:#f2c84b;opacity:.9}
.dock .lbl{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#2b2340;color:#fff;border-radius:8px;padding:0 10px;font-size:12px;font-weight:700;white-space:nowrap;z-index:3}
.road{position:absolute;left:0;right:0;background:var(--noise),linear-gradient(180deg,#55555e,#4b4b53)}
.road .lane{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 22px,transparent 22px 44px)}
.road .curb{position:absolute;left:0;right:0;height:7px;background:linear-gradient(180deg,#e2ddd3,#b9b3a8)}
.trk{position:absolute;width:112px;height:42px;left:-130px;z-index:6}
.trk i,.van i{position:absolute;display:block}
.trk .tsh{left:6px;top:8px;width:110px;height:42px;border-radius:6px;background:rgba(0,0,0,.35);filter:blur(4px)}
.trk .whl{width:14px;height:6px;border-radius:2px;background:#1c1c20;z-index:0}
.trk .trl{position:absolute;left:0;top:0;width:76px;height:42px;border-radius:3px;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0) 30%,rgba(0,0,0,.08)),repeating-linear-gradient(90deg,#f6f6f8 0 6px,#e2e2e7 6px 8px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.trk .trl::before{content:"";position:absolute;left:4px;right:4px;top:14px;height:14px;border-radius:3px;background:var(--brand);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.trk .tlogo{position:absolute;left:30px;top:12px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--brand);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.trk .hitch{position:absolute;left:74px;top:17px;width:8px;height:8px;background:#333;z-index:0}
.trk .cab{position:absolute;left:80px;top:4px;width:30px;height:34px;border-radius:5px 12px 12px 5px;z-index:1;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 80%,#000),var(--brand) 40%,color-mix(in srgb,var(--brand) 75%,#fff));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.2)}
.trk .ws{right:2px;top:4px;width:8px;height:26px;border-radius:2px 8px 8px 2px;background:linear-gradient(90deg,#9fd3ff,#d9efff)}
.trk .lb{left:4px;top:13px;width:4px;height:8px;border-radius:2px;background:#ffb020;box-shadow:0 0 5px #ffb020}
.trk .mir{right:8px;width:4px;height:5px;background:#222;border-radius:1px}
.trk .mir.l{top:-4px}.trk .mir.r{bottom:-4px}
.trk.go{animation:drive 4.4s ease-in-out forwards}
@keyframes drive{0%{left:-130px}35%{left:var(--stop)}60%{left:var(--stop)}100%{left:calc(100% + 20px)}}
.van{position:absolute;left:0;top:0;width:46px;height:24px;z-index:5}
.van .tsh{left:4px;top:5px;width:46px;height:24px;border-radius:6px;background:rgba(0,0,0,.3);filter:blur(3px)}
.van .vbody{position:absolute;inset:0;border-radius:5px 9px 9px 5px;background:linear-gradient(180deg,#fff,#e6e6ea);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),inset 0 0 0 1px rgba(0,0,0,.12)}
.van .vbody::after{content:"";position:absolute;left:4px;right:14px;top:9px;height:6px;background:var(--brand);border-radius:2px}
.van .vws{right:2px;top:3px;width:6px;height:18px;border-radius:2px 6px 6px 2px;background:linear-gradient(90deg,#9fd3ff,#d9efff)}
/* Weltzonen */
.zlabel{position:absolute;background:rgba(255,255,255,.92);border-radius:9px;padding:0 9px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.field{position:absolute;border-radius:8px;background:var(--noise),linear-gradient(180deg,#8a6a45,#7a5b39);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.15)}
.crop{position:absolute;height:12px;border-radius:6px;background:radial-gradient(circle at 10px 6px,#7fc95d 0 5px,transparent 6px) 0 0/20px 12px repeat-x,linear-gradient(transparent 0 5px,#5a4329 5px 7px,transparent 7px)}
.silo{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffffff,#d5d9df 35%,#9aa1ab 75%,#7d848e);box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.silo i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9ced6,#8a919b);box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.pond{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#9fdcff,#4aa3d8 60%,#2f7fb3);box-shadow:inset 0 0 0 4px #d6cfc2,inset 0 6px 12px rgba(0,0,0,.25)}
.flag{position:absolute;width:24px;height:44px}
.flag::before{content:"";position:absolute;left:3px;top:2px;width:2px;height:40px;background:#888;box-shadow:2px 3px 2px rgba(0,0,0,.3)}
.flag span{position:absolute;left:5px;top:0;font-size:16px;line-height:1;animation:wave 2s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(6deg) scaleX(.92)}}
.sidestreet{position:absolute;background:var(--noise),linear-gradient(90deg,#4b4b53,#55555e 50%,#4b4b53);box-shadow:inset 3px 0 0 #c9c3b8,inset -3px 0 0 #c9c3b8}
.sidestreet::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 16px,transparent 16px 32px)}
.shop{position:absolute;cursor:pointer;border-radius:6px;background:var(--noise),linear-gradient(180deg,#efe7da,#e1d6c4);box-shadow:0 10px 0 #b3a68f,0 14px 12px rgba(0,0,0,.3)}
.shop .roof{position:absolute;left:0;right:0;top:0;height:58%;border-radius:6px 6px 0 0;background:var(--noise),linear-gradient(180deg,color-mix(in srgb,var(--rc) 85%,#fff),var(--rc));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.shop .roof::after{content:"";position:absolute;right:10px;top:8px;width:18px;height:12px;border-radius:2px;background:#9aa1ab;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),2px 3px 2px rgba(0,0,0,.25)}
.shop .awn{position:absolute;left:4px;right:4px;top:58%;height:12px;background:repeating-linear-gradient(90deg,#fff 0 8px,var(--rc,#c0483b) 8px 16px);border-radius:0 0 6px 6px;box-shadow:0 3px 3px rgba(0,0,0,.2)}

#world{overflow:hidden!important;position:relative}
#cv{display:block;touch-action:none;cursor:grab}
/* ================= Navigation ================= */
nav{position:relative;z-index:50;display:flex;background:#fff;border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(0,0,0,.1)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font-weight:700;font-size:10px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;position:relative}
nav button .i{font-size:22px;line-height:1.15}
nav button.active{color:var(--ink)}
nav button.active .i{transform:scale(1.15)}
nav .badge{position:absolute;top:3px;right:calc(50% - 18px);width:12px;height:12px;border-radius:6px;background:var(--red);display:none;border:2px solid #fff}
nav .badge.on{display:block}

/* ================= Panels ================= */
.shade{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(30,20,50,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:24px 24px 0 0;max-height:calc(100% - 228px - env(safe-area-inset-top));display:flex;flex-direction:column;transform:translateY(110%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.9,.3,1.1),visibility 0s .25s;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1.1),visibility 0s}
.sheet .hd{padding:6px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line)}
.sheet .hd .big{font-size:34px}
.sheet .hd h2{margin:0;font-size:21px;line-height:1.1}
.sheet .hd .sub{font-size:13px;color:var(--muted);line-height:1.2}
.sheet .x{margin-left:auto;width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:0;background:#fff;font-size:18px;font-weight:800;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}
.grab{width:44px;height:5px;border-radius:3px;background:#d8ccb6;margin:8px auto 0}
.card{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:9px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px}
.card .ic{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:26px}
.card .tx{flex:1;min-width:0}
.card .t1{font-weight:800;font-size:15px;line-height:1.15}
.card .t2{font-size:12.5px;color:var(--muted);line-height:1.3}
.card .t2 b{color:var(--ink)}
.pr{height:7px;border-radius:4px;background:#eee4d2;margin-top:4px;overflow:hidden}
.pr i{display:block;height:100%;background:var(--gold2);width:0}
.pr.g i{background:var(--green)}
.card.dim{opacity:.55}
.card.cur{box-shadow:0 0 0 3px var(--gold),0 3px 0 var(--line)}
.card.own{box-shadow:0 0 0 2px #bfe8cc,0 3px 0 var(--line)}
.btn{border:0;border-radius:14px;font-weight:800;font-size:15px;padding:6px 12px;min-width:100px;line-height:1.1;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green2);text-align:center}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.95}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--green2)}
.btn:disabled{background:#cfc6b6;box-shadow:0 4px 0 #b3a994;color:#fff}
.btn.gold{background:var(--gold2);box-shadow:0 4px 0 #c97f0c}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #2a7fd0}
.btn.red{background:var(--red);box-shadow:0 4px 0 #d23b4a}
.btn.ghost{background:#fff;color:var(--muted);box-shadow:0 3px 0 var(--line);min-width:0;font-size:12px;padding:4px 9px}
.btn.wide{width:100%;padding:11px;font-size:17px;margin-top:8px}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 2px;border-bottom:1.5px dashed var(--line)}
.statrow:last-child{border:0}
.statrow b{font-weight:800;text-align:right}
.sect{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.info{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:0 3px 0 var(--line);font-size:14px;line-height:1.4}

.hero{text-align:center}
.hero .n{font-size:38px;font-weight:800;line-height:1}
.seg{display:flex;background:#eee4d2;border-radius:12px;padding:3px;gap:3px;margin-bottom:9px}
.seg button{flex:1;border:0;background:none;border-radius:9px;font-weight:800;font-size:14px;padding:4px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.tag{display:inline-block;border-radius:7px;padding:0 6px;font-size:11px;font-weight:800;background:#f1ead9;color:var(--ink);margin:2px 3px 0 0}
.tag.g{background:#d9f5e2;color:#1f7a43}.tag.r{background:#ffe0e3;color:#c22f3e}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:700 16px var(--f);color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text;outline:none}
input[type=text]:focus{border-color:var(--gold2)}
textarea{height:70px;font-size:11px;resize:none;font-family:monospace}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0}
.avgrid button{aspect-ratio:1;border:0;border-radius:50%;font-size:26px;background:#fff;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.avgrid button.on{box-shadow:0 0 0 3px var(--gold2),0 3px 0 var(--line);transform:scale(1.06)}
.colgrid{display:flex;gap:8px;justify-content:center;margin:8px 0}

.lbl2{font-weight:800;font-size:13px;color:var(--muted);text-align:left;margin-top:10px;text-transform:uppercase;letter-spacing:.05em}
.meter{height:14px;border-radius:7px;background:#eee4d2;overflow:hidden;position:relative;margin:6px 0 2px}

.meter .th{position:absolute;top:0;bottom:0;width:2px;background:rgba(43,35,64,.35)}

/* ================= Packtisch ================= */
.packer{position:absolute;left:10px;right:10px;z-index:44;background:var(--panel);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 10px 30px rgba(0,0,0,.25);padding:10px 12px 12px;display:none}
.packer.on{display:block;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.pk-hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.pk-hd .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:#fff;font-weight:800;box-shadow:0 2px 0 var(--line)}
.pk-body{display:flex;align-items:center;gap:12px;margin-top:6px}

.pk-can:active{transform:translateY(3px)}
.pk-slot{position:absolute;width:24px;height:15px;border-radius:7px;border:2px dashed #c9c1b2;left:57px;top:61px}
.pk-slot.f{border:0;background-image:var(--noise),radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.55),transparent 55%)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),inset 0 0 0 3px rgba(0,0,0,.08),inset 0 -3px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.35);animation:plop .25s cubic-bezier(.2,1.6,.4,1)}
.pk-slot.f::after{content:"";position:absolute;inset:3px;border-radius:5px;border:1px dashed rgba(0,0,0,.18)}
@keyframes plop{from{scale:1.8;opacity:0}}
.pk-logo{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.pk-lid{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--brand) 0 40%,#fff 41% 44%,var(--brand) 45%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;opacity:0;transform:scale(1.3);pointer-events:none;transition:all .18s}
.pk-lid.on{opacity:1;transform:scale(1)}
.pk-side{flex:1;min-width:0}
.pk-side .big{font-size:22px;font-weight:800;line-height:1.1}
.pk-side .t2{font-size:13px;color:var(--muted);line-height:1.3}
.pk-side .goal{margin-top:6px}
.fab{position:absolute;right:12px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold2);box-shadow:0 5px 0 #c97f0c,0 8px 14px rgba(0,0,0,.25);font-size:28px;display:none}
.fab.on{display:block}
.fab small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#2b2340;color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:0 6px;white-space:nowrap}


/* ===== Missionen, Events, Tägliche Belohnung, Manager ===== */
.mcard{pointer-events:auto;margin:6px auto 0;width:min(290px,86%);background:rgba(255,255,255,.96);border-radius:14px;padding:5px 10px 6px;box-shadow:0 3px 0 rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.12);cursor:pointer}
.mcard .mt{font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mrow{display:flex;align-items:center;gap:8px}.mcard .mrow .pr{flex:1;margin:3px 0 0}.mcard .mrow span{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.mcard .mr{font-size:11px;color:var(--muted);font-weight:700}
.mcard.done{background:linear-gradient(180deg,#e9fff0,#c9f5d6);box-shadow:0 0 0 2px var(--green),0 3px 0 var(--green2);animation:mpulse 1.2s ease-in-out infinite}
.mcard.done .mrow span{color:var(--green2)}
@keyframes mpulse{50%{transform:scale(1.03)}}
.evbar{pointer-events:auto;margin:5px auto 0;width:max-content;max-width:92%;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;border-radius:12px;padding:2px 12px;font-weight:800;font-size:12px;display:none;box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer}
.evbar.on{display:block}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.dt{background:#fff;border-radius:12px;padding:5px 3px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.15}
.dt b{font-size:11px}.dt span{font-size:22px}.dt small{font-size:9.5px;color:var(--muted);font-weight:700;text-align:center}
.dt.d{opacity:.45}.dt.d span::after{content:" ✓"}
.dt.t{box-shadow:0 0 0 3px var(--gold2),0 2px 0 var(--line);transform:scale(1.05)}
.dt:last-child{grid-column:span 2}
.crate-anim{font-size:70px;animation:crate .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes crate{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
.mgrcard{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 0 0 3px var(--rc),0 4px 0 var(--line)}
.mgrcard .mav{font-size:44px}
.card.mgr{box-shadow:0 0 0 2px var(--rc),0 3px 0 var(--line)}
.pk-can{background:none!important;box-shadow:none!important;border-radius:50%}
.pk-can svg{display:block;overflow:visible}
.pkNew{animation:pkIn .22s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
@keyframes pkIn{from{opacity:0;transform:scale(1.8)}}
.pkLidG{opacity:0;transform:translateY(-18px) scale(1.12);transform-origin:100px 100px;transition:all .25s cubic-bezier(.2,1.2,.4,1)}
.pkLidG.on{opacity:1;transform:none}
.dp-head{display:flex;gap:10px;align-items:center}.dp-lv{background:#4f46e5;color:#fff;border-radius:10px;padding:0 10px;font-weight:800;font-size:20px}
.bar2{border-radius:12px;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;display:flex;justify-content:space-between;margin:6px 0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ladder{display:flex;justify-content:space-between;position:relative;margin:10px 0 2px}.ladder::before{content:"";position:absolute;left:10%;right:10%;top:40px;height:4px;background:#c7d2fe}
.lstep{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:#4f46e5;width:20%;gap:2px}
.lstep .c{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #c7d2fe;display:flex;align-items:center;justify-content:center;font-size:24px}
.lstep.on .c{box-shadow:0 0 0 3px #4f46e5}.lstep.off .c{filter:grayscale(1);opacity:.45}.lstep small{color:#16a34a;font-weight:800}
.sheet-open .mcard,.sheet-open .evbar{display:none!important}
.chips{flex-wrap:nowrap!important;gap:4px!important}.chip{padding:0 6px!important;font-size:11.5px!important}.chip .mb{width:28px!important}
/* ================= Popups ================= */
.modal{position:absolute;inset:0;z-index:60;background:rgba(30,20,50,.55);display:none;align-items:center;justify-content:center;padding:22px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:24px;padding:20px;width:100%;max-width:360px;max-height:100%;overflow-y:auto;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 0 rgba(0,0,0,.12)}

.modal h2{margin:2px 0 4px;font-size:24px;line-height:1.1}
.modal p{margin:4px 0;color:var(--muted);font-size:15px;line-height:1.35}
.modal .em{font-size:56px;line-height:1.1}
.modal .reward{font-size:30px;font-weight:800;color:var(--green2);margin:6px 0}
.preview{display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:5px 14px 5px 5px;box-shadow:0 3px 0 var(--line);margin:4px auto 6px;width:max-content;max-width:100%}
.preview .pname{font-size:17px}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 152px);transform:translateX(-50%) translateY(-10px);background:#2b2340;color:#fff;padding:7px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:70;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:20px;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);z-index:65;animation:fxup 1.1s ease-out forwards;white-space:nowrap}
@keyframes fxup{to{transform:translateY(-60px);opacity:0}}
.chip .mb{display:none!important}.chip{white-space:nowrap;flex-shrink:0}.chips{gap:3px!important;padding:0 4px}@media (max-width:400px){.chip{padding:0 5px!important;font-size:10.5px!important}}.chip.warn{background:#fee2e2;color:#b91c1c;animation:wpulse 1s infinite}@keyframes wpulse{50%{transform:scale(1.08)}}
.evbar.ord{background:linear-gradient(90deg,#0ea5e9,#2563eb)}.evbar.tmp{background:linear-gradient(90deg,#f59e0b,#ea580c)}
#cine{position:fixed;inset:0;pointer-events:none;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,0) 65%)}
#cine.on{animation:cine 3.2s ease forwards}#cine .ce{font-size:64px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}#cine h1{color:#fff;font-size:30px;margin:6px 16px 0;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.4);letter-spacing:.5px}#cine p{color:#fde68a;font-weight:800;margin:4px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes cine{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.al{background:#fff7e8;border-radius:10px;padding:6px 2px;text-align:center;box-shadow:inset 0 0 0 2px #f0e2c4}.al span{font-size:24px;display:block}.al small{font-size:9.5px;font-weight:700;display:block;line-height:1.15;word-break:break-word}.al.off{opacity:.45;filter:grayscale(1)}
.srow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}.srow>span{min-width:92px}.srow b{min-width:64px;text-align:right}.sbar{flex:1;height:10px;background:#eee4d2;border-radius:5px;overflow:hidden}.sbar i{display:block;height:100%;border-radius:5px}
.card.cur{box-shadow:0 0 0 3px #22c55e inset}.card.dim{opacity:.55}
.hudrow2{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:6px;pointer-events:none;flex-wrap:wrap;padding:0 4px}.mini{display:contents}
.mp{pointer-events:auto;position:relative;overflow:hidden;background:rgba(255,255,255,.96);border-radius:11px;height:22px;padding:0 8px;font-weight:800;font-size:11.5px;display:flex;align-items:center;gap:3px;box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap;cursor:pointer}
.mp.warn{background:#fee2e2;color:#b91c1c;animation:wpulse 1s infinite}.mp.evBar{background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff}.mp.ordBar{background:linear-gradient(90deg,#0ea5e9,#2563eb);color:#fff}.mp.tmpBar{background:linear-gradient(90deg,#f59e0b,#ea580c);color:#fff}.mp.boostBar{background:linear-gradient(90deg,#ff7ac6,#ffb347);color:#fff}
.mp.mis{padding-bottom:2px}.mp.mis i{position:absolute;left:0;bottom:0;height:3px;background:#22c55e;border-radius:2px}.mp.mis.done{background:linear-gradient(180deg,#e9fff0,#c9f5d6);color:#15803d;box-shadow:0 0 0 2px #22c55e;animation:mpulse 1.2s infinite}
.hudT{pointer-events:auto;min-width:30px;height:22px;border-radius:11px;border:0;background:rgba(43,35,64,.88);color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer}
.hudmin .hud .chips,.hudmin .hud .boostbar,.hudmin .hud .evbar,.hudmin .hud .mcard{display:none!important}.hudmin .money .v{font-size:23px}.hudmin .money{padding:2px 16px 3px}
.sheet-open .hudrow2{display:none}.fab{transition:transform .3s}.fab.sm{transform:scale(.7);transform-origin:right bottom}
.mapwrap{margin:8px 0;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.12)}.stk{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 4px;background:#eee4d2}.stk i{display:block;height:100%}
.tagc{background:#fef3c7;color:#92400e;border-radius:9px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}.warnbox{margin-top:8px;background:#fee2e2;border-radius:12px;padding:8px;font-size:12px;color:#7f1d1d}.warnbox .btn{margin-top:6px}
.hud .hrow{gap:8px;align-items:center}.hud .prof{flex:0 0 auto;background:none;box-shadow:none;padding:0}.hud .prof .pinfo{display:none}
.hud .av{width:54px;height:54px;flex:0 0 54px;font-size:30px;background:radial-gradient(circle closest-side,var(--brand) 0 80%,rgba(0,0,0,.25) 81% 83%,transparent 84%),conic-gradient(#ffb020 calc(var(--xp,0)*1%),rgba(255,255,255,.95) 0);box-shadow:0 3px 0 rgba(43,35,64,.25),0 6px 14px rgba(43,35,64,.2)}
.hud .av .lvl{bottom:-3px;right:-4px;z-index:2}.hud .av::after{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(#ffb020 calc(var(--xp,0)*1%),rgba(255,255,255,.95) 0);-webkit-mask:radial-gradient(circle closest-side,transparent 84%,#000 86%);mask:radial-gradient(circle closest-side,transparent 84%,#000 86%);pointer-events:none}.hud .hrow .money{margin:0;flex:1;width:auto;min-width:0;padding:4px 10px 5px}.money .cn{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hud .money .v{font-size:24px}.hud .res{gap:4px}.hud .pill{height:24px;font-size:13.5px;min-width:58px;padding:0 8px;border-radius:12px}.hudmin .hud .money .v{font-size:23px}
</style>

}

const SUF=['','Tsd','Mio','Mrd','Bio','Brd','Trio','Trd','Quad','Qard','Quin','Qind'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return (n<10 && n%1) ? n.toFixed(1).replace('.',',') : Math.floor(n).toLocaleString('de-DE');
  const e=Math.floor(Math.log10(n)/3);
  const suf = e<SUF.length ? SUF[e] : (()=>{const k=e-SUF.length; return String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);})();
  const v=n/Math.pow(1000,e);
  return v.toFixed(v<10?2:v<100?1:0).replace('.',',')+' '+suf;
}
const eur = n => fmt(n)+' €';
const x2 = n => n.toFixed(2).replace('.',',')+'×';
function fmtTime(s){ s=Math.max(0,s);
  if(s<60) return Math.ceil(s)+' s';
  if(s<3600) return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+' min';
  return Math.floor(s/3600)+' h '+Math.floor(s%3600/60)+' min'; }

const ptrs=new Map(); let dragDist=0, pinch0=0;
cvs.addEventListener('pointerdown',e=>{ cvs.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragDist=0; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); } });

  if(ptrs.size===1){ panBy(e.clientX-p.x,e.clientY-p.y); dragDist+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y); }

function tapAt(sx,sy){

function custSpawn(){ if(CUSTS.length>=gfxCust()) return; const a=makePerson(true,false); a.work=false; a.vip=Math.random()<.06; a.sp=rnd(.95,1.2); a.v=0;
  const park=Math.random()<.6; if(park){ a.ox=30.4; a.oy=rnd(25.6,36); a.path=[[30.4,30.9],[26.9,30.9]]; } else { a.ox=rnd(6,25); a.oy=24.95; a.path=[[26.9,24.95],[26.9,30.9]]; }
  a.x=a.ox; a.y=a.oy; a.yaw=0;
  const open=S.store.d.map((d,i)=>d.l>0?i:-1).filter(i=>i>=0); a.depts=[pick(open)]; if(open.length>1&&Math.random()<.45){ const j=pick(open); if(j!==a.depts[0]) a.depts.push(j); }
  a.path.push([25.4,30.9],[20.4,30.9]); custToDept(a); CUSTS.push(a); }
function custToDept(a){ const i=a.depts.shift(), R=deptRect(i), sx=R.x0+1.7+rnd(-1.2,1.2); a.path.push([sx,30.9],[sx,R.sy+rnd(-.08,.08)]); a.st='walk'; a.next='browse'; }
function custExit(a,fromY){ if(a.oy<25.5) a.path.push([26.9,fromY],[26.9,24.95],[a.ox,24.95]); else a.path.push([26.9,fromY],[30.4,fromY],[30.4,a.oy]); a.st='walk'; a.next='gone'; }
function custMove(a,dt){ if(a.path.length){ const [tx,ty]=a.path[0], dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
    if(d<.05){ a.path.shift(); } else { a.v=Math.min(a.sp,a.v+dt*2.2); const st=Math.min(d,a.v*dt); a.x+=dx/d*st; a.y+=dy/d*st; a.ph+=st*9.5;
      const want=Math.atan2(dx,dy); let df=want-a.yaw; df=Math.atan2(Math.sin(df),Math.cos(df)); a.yaw+=df*Math.min(1,dt*10); } }
  else a.v=Math.max(0,a.v-dt*3);
  a.g.rotation.y=a.yaw; a.g.position.set(a.x,0,a.y); animPerson(a,dt); }
function updateCustomers(dt){
  if(!S.store.open||!ST_LN.length){ return; }
  const arr=stArrival(), vis=Math.min(arr,28), k=arr/Math.max(.01,vis), svc=60/stPerChk()*k;
  custTimer+=dt; if(custTimer>60/Math.max(1,vis)){ custTimer=0; custSpawn(); }
  ST_LN.forEach(L=>{ L.q=L.q.filter(c=>CUSTS.includes(c)); L.q.forEach((c,i)=>{ if(c.st==='q'){ const sx=22.9-.55*i; if(c.path.length) c.path[c.path.length-1]=[sx,L.y]; else if(Math.abs(c.x-sx)>.05) c.path=[[sx,L.y]]; } });
    const f=L.q[0]; if(f && f.st==='q' && !f.path.length && Math.abs(f.x-22.9)<.08){ L.t+=dt; f.pay=Math.min(1,L.t/svc); if(L.t>=svc){ L.t=0; L.q.shift(); f.pay=0;
        const val=stBasket()*gMs()*(f.vip?5:1); if(f.vip){ earn(val); if(Math.random()<.25) S.gold+=1; S.vips=(S.vips||0)+1; SFX.cash(); } else SFX.beep(); POPS.push({x:22.9,y:L.y,z:1.5,txt:'+'+eur(val),t:0}); f.mood=(TIME-f.qT)>svc*2.6?'😐':'😊'; f.moodT=2.4;
        f.path=[[24.6,L.y],[24.6,30.25]]; custExit(f,30.25); } } });
  CUSTS.forEach(a=>{ custMove(a,dt); if(a.moodT>0) a.moodT-=dt;
    if(a.st==='q' && TIME-a.qT>svc*2.6 && !(a.moodT>0)){ a.mood='😐'; a.moodT=.3; }
    if(a.path.length) return;
    if(a.st==='walk' && a.next==='browse'){ a.st='browse'; a.wait=rnd(1.2,2.4); }
    else if(a.st==='browse'){ a.wait-=dt; if(a.wait<=0){
        if(a.depts.length){ a.path=[[a.x,30.9]]; custToDept(a); }
        else { let best=null; ST_LN.forEach(L=>{ if(!best||L.q.length<best.q.length) best=L; });
          if(!best||best.q.length>=4){ a.mood='😠'; a.moodT=3; a.path=[[a.x,30.25],[24.6,30.25]]; custExit(a,30.25); }
          else { best.q.push(a); a.st='q'; a.qT=TIME; a.path=[[a.x,30.9],[20.4,30.9],[20.4,best.y],[22.9-.55*(best.q.length-1),best.y]]; } } } }
    else if(a.st==='walk' && a.next==='gone'){ a.dead=true; DYN.remove(a.g); } });
  CUSTS=CUSTS.filter(a=>!a.dead);
  if(DEPTPOP){ DEPTPOP.t+=dt; const g=DEPTG[DEPTPOP.i], p=Math.min(1,DEPTPOP.t/.7); if(g) g.scale.y=Math.max(.01,1+Math.sin(p*Math.PI)*.25*(1-p))*Math.min(1,p*1.6); if(p>=1){ if(g) g.scale.y=1; DEPTPOP=null; } }
}

function auSched(){ const c=AU.ctx; if(!c) return; if(S.snd&&S.snd.m<=0){ AU.next=Math.max(AU.next,c.currentTime); return; } const spb=60/84/4;
  if(AU.next<c.currentTime) AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.2){ const t=AU.next, st=AU.step%16, ch=CHORDS[Math.floor(AU.step/16)%4], night=NIGHT>.6;
    if(st===0){ ch.forEach(n=>{ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=night?600:950; f.connect(AU.mus); tone(mtof(n),t,spb*16,'triangle',.035,f,.35); }); }

    if(st===6) tone(mtof(ch[2]-12),t,spb*3,'sine',.08,AU.mus,.01);
    if(st===0||st===8) tone(110,t,.32,'sine',.22,AU.mus,.002,40);

    if(st%2===0&&Math.random()<(night?.18:.3)){ const v=tone(mtof(pick(PENTA)),t,spb*3,'sine',.045,AU.mus,.01); v.connect(AU.delay); }

const COMP_Q={'Frostbite Inc.':{kick:3,geruch:-1},'Kraken Group':{geschmack:3,kissen:-1},'Vela AB':{kissen:2,geruch:2,kick:-2}};
const qLv=k=>(S.qual&&S.qual[k])||0;
const qCost=k=>50*Math.pow(5,qLv(k));
const qSum=()=>QATTR.reduce((a,q)=>a+qLv(q.k),0);
const compBase=()=>Math.max(0,Math.floor(1.5*Math.log10(Math.max(1,S.lifetime)))-5);
const compLv=(c,k)=>{ const b=compBase(); return b>0?Math.max(0,b+((COMP_Q[c.n]||{})[k]||0)):0; };
function bestComp(k){ let b=null; COMPS.forEach(c=>{ const v=compLv(c,k); if(!b||v>b.v) b={c,v}; }); return b; }
function qualLosses(){ return QATTR.filter(q=>bestComp(q.k).v>qLv(q.k)); }
function qualMult(){ return Math.max(.5,1+QATTR.reduce((a,q)=>a+.05*Math.max(-4,Math.min(6,qLv(q.k)-bestComp(q.k).v)),0)); }
let QWARN={};
function qualTick(){ if(!S.onboarded||handPhase()||S.lifetime<3e3) return; QATTR.forEach(q=>{ const b=bestComp(q.k), lose=b.v>qLv(q.k);
  if(lose&&!QWARN[q.k]){ QWARN[q.k]=1; toast(`${b.c.em} ${b.c.n} hat bessere ${q.n} (${q.em} Lv ${b.v}) – du verlierst Marktanteile!`); } if(!lose) QWARN[q.k]=0; }); }

  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n, r=R0*v/mx; return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]; };

  BD().querySelectorAll('[data-reneg]').forEach(b=>b.onclick=e=>{
    const c=S.contracts.find(o=>o.id===+b.dataset.reneg); if(!c||Date.now()<(c.reneg||0)+600000) return;

    const c=S.contracts.find(o=>o.id===+b.dataset.cancel);

  let h=head+`<div class="info"><p>Forschung bleibt <b>für immer</b> – auch nach Produktwechsel und Neugründung. Gold 🪙 gibt's von Drohnen, Level-Ups und neuen Produkten.</p></div><div class="sect">Boosts</div>`;

   <radialGradient id="pkP" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${shade(st.c1,18)}"/><stop offset=".55" stop-color="${st.c1}"/><stop offset="1" stop-color="${st.c2}"/></radialGradient>
   <pattern id="pkFib" width="8" height="6" patternUnits="userSpaceOnUse"><path d="M0 1 L3 2 M4 4 L8 3 M1 5 L5 6 M5 0 L7 1" stroke="${st.kind==='loose'?'#2a180b':'rgba(120,110,95,.28)'}" stroke-width=".5"/></pattern>
   <pattern id="pkSpot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.5" r=".7" fill="rgba(40,22,10,.45)"/><circle cx="3.6" cy="3.8" r=".5" fill="rgba(40,22,10,.35)"/><circle cx="4" cy="1" r=".35" fill="rgba(255,255,255,.25)"/></pattern>
   <filter id="pkSh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity=".35"/></filter>

  </defs>
  <circle cx="100" cy="103" r="97" fill="rgba(0,0,0,.25)"/>

  PK_POS.forEach((p,k)=>{ const j=PK_JIT[k], w=st.slim?p.w+3:p.w, hh=st.slim?p.h*.68:p.h, x=-w/2, y=-hh/2;
    if(k>=n){ h+=`<rect x="${p.x+x}" y="${p.y+y}" width="${w}" height="${hh}" rx="${hh/2.3}" transform="rotate(${p.r} ${p.x} ${p.y})" fill="none" stroke="rgba(150,140,120,.35)" stroke-width="1" stroke-dasharray="2.5 2"/>`; return; }

function paintCan(lid){ S.pk=Math.min(S.pk||0,PK_N); $('pkCan').innerHTML=canSVG(S.pk,lid); $('pkCnt').textContent=`${S.pk} / ${PK_N}`; }

$('pkCan').addEventListener('click',e=>{

  const spots=[]; ROOMS.forEach(R=>{ if(R.unlocked) spots.push({x:(R.x0+R.x1)/2+rnd(-1.5,1.5),y:(R.y0+R.y1)/2+rnd(-1,1),z:1.5}); });

  if(!spots.length) return; const s=pick(spots);
  COINS.push({...s, t:0, val:Math.max(15,income()*rnd(5,10))*(s.shop?1.2:1)*eventCoin()});
}
function tickCoins(dt){ if(!S.onboarded||handPhase()) return; coinTimer+=dt; COINS.forEach(c=>c.t+=dt); COINS=COINS.filter(c=>c.t<30);
  if(coinTimer>coinNext && COINS.length<1*eventCoin()){ coinTimer=0; coinNext=rnd(45,90)/eventCoin(); spawnCoin(); } }
function drawCoins(fs){ COINS.forEach(c=>{ const [sx,sy]=P(c.x,c.y,c.z+.15*Math.sin(TIME*3+c.x)); const r=Math.max(15,17*cam.z/.62), fade=c.t>25?Math.max(0,(30-c.t)/5):1;
  ctx.globalAlpha=fade*Math.min(1,c.t*3); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(sx,sy+r+6,r*.7,r*.25,0,0,7); ctx.fill();
  const g=ctx.createRadialGradient(sx-r*.3,sy-r*.3,2,sx,sy,r); g.addColorStop(0,'#bdf7cf'); g.addColorStop(1,'#22a35a'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.font=`${Math.round(r*1.05)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💵',sx,sy+1); ctx.globalAlpha=1;
  LHITS.push({r:[sx-r-6,sy-r-6,r*2+12,r*2+12],act:()=>collectCoin(c,sx,sy)}); }); }

  {t:'Baue die Portionierung',                  p:()=>S.floors[4].m>0?1:0,            n:1,   r:{crate:1}},
  {t:'Eröffne den Onlineshop',                  p:()=>S.online,                       n:1,   r:{gold:8}},
  {t:'Schalte „Extra Stark" frei',              p:()=>S.str,                          n:2,   r:{secs:300}},
  {t:'Erreiche 1 Mio €/s Einkommen',            p:()=>income(),                       n:1e6, r:{crate:2}},
  {t:'Baue die White-Pouch-Linie',              p:()=>S.floors[5].m>0?1:0,            n:1,   r:{gold:10}},
  {t:'Gründe eine neue Firma ⭐',               p:()=>S.resets,                       n:1,   r:{gold:12}},
];
function mission(){ const k=S.mission||0; if(k<MISSIONS.length) return MISSIONS[k];
  const j=k-MISSIONS.length, n=Math.pow(10,7+j); return {t:`Erreiche ${fmt(n)} €/s Einkommen`, p:()=>income(), n, r:j%2?{crate:2}:{gold:10+j*2}}; }
function updateMission(){ const el=$('mCard'); if(!S.onboarded){ el.style.display='none'; return; } el.style.display='';
  const m=mission(), v=Math.min(m.n,m.p()), done=v>=m.n;
  el.classList.toggle('done',done);
  el.innerHTML=`<div class="mt">🎯 ${m.t}</div><div class="mrow"><div class="pr g"><i style="width:${v/m.n*100}%"></i></div><span>${done?'✔ Abholen':(m.n>=1000?fmt(v)+' / '+fmt(m.n):Math.floor(v)+' / '+m.n)}</span></div><div class="mr">🎁 ${rewardText(m.r)}</div>`; }
$('mCard').onclick=()=>{ const m=mission(); if(m.p()<m.n){ toast('🎯 '+m.t); return; } giveReward(m.r); S.mission=(S.mission||0)+1;
  const r=$('mCard').getBoundingClientRect(); fx(r.left+r.width/2,r.top,'🎁 '+rewardText(m.r)); toast('✅ Mission erfüllt!'); save(); updateMission(); };

// ---------- 3) Tägliche Belohnung ----------
const DAILY=[{secs:120,min:100},{gold:2},{secs:300,min:250},{gold:4},{secs:600,min:500},{crate:1},{gold:8,crate:2}];
const dayStr=d=>{ d=d||new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function dailyState(){ const today=dayStr(), y=new Date(); y.setDate(y.getDate()-1); const D=S.daily||{last:'',streak:0};
  if(D.last===today) return {avail:false, idx:(D.streak-1)%7, streak:D.streak};
  const cont=D.last===dayStr(y); return {avail:true, idx:(cont?D.streak:0)%7, streak:cont?D.streak:0}; }
let dailyShown=false;
function showDaily(force){ const st=dailyState(); if(!st.avail && !force) return;
  const tiles=DAILY.map((r,k)=>{ const done=st.avail?k<st.idx:k<=st.idx, today=st.avail&&k===st.idx;
    return `<div class="dt ${done?'d':''} ${today?'t':''}"><b>Tag ${k+1}</b><span>${r.crate?'📦':r.gold?'🪙':'💶'}</span><small>${rewardText(r)}</small></div>`; }).join('');
  modal(`<div class="em">🎁</div><h2>Tägliche Belohnung</h2><p>${st.avail?`Serie: <b>${st.streak} ${st.streak===1?'Tag':'Tage'}</b> – komm jeden Tag wieder!`:'Heute schon abgeholt. Bis morgen!'}</p>
    <div class="dgrid">${tiles}</div>${st.avail?`<button class="btn wide gold" id="dGo">Tag ${st.idx+1} abholen</button>`:'<button class="btn wide" id="dGo">OK</button>'}`,
  ()=>{ $('dGo').onclick=()=>{ if(st.avail){ const r=DAILY[st.idx]; S.daily={last:dayStr(),streak:st.streak+1}; closeModal(); giveReward(r); toast('🎁 '+rewardText(r)); save(); } else closeModal(); }; });
}

// ---------- 4) Manager ----------
const MGR_FIRST=['Lars','Ingrid','Björn','Astrid','Sven','Freja','Olof','Elsa','Gustav','Sigrid','Nils','Maja','Erik','Linnea','Henrik','Saga','Anton','Ebba','Viktor','Tove'];
const MGR_LAST=['Lindqvist','Berg','Nyström','Holm','Ek','Sjöberg','Dahl','Lund','Strand','Falk'];
const MGR_AV=['👨‍💼','👩‍💼','🧔‍♂️','👱‍♀️','👨‍🦰','👩‍🦰','🧑‍💼','👴','👵','🕴️'];
const RARITY=[{n:'Gewöhnlich',c:'#8b95a1',b:.25,sell:1},{n:'Selten',c:'#3b82f6',b:.6,sell:3},{n:'Episch',c:'#a855f7',b:1.5,sell:8},{n:'Legendär',c:'#f59e0b',b:4,sell:20}];
const CRATES={std:{n:'Manager-Kiste',em:'📦',cost:12,w:[60,28,10,2]}, premium:{n:'Premium-Kiste',em:'🎁',cost:40,w:[0,55,35,10]}};
const MGR_MAX=30;
function mgrById(id){ return S.managers.find(m=>m.id===id); }
function mgrOf(i){ const id=S.mgrAssign[i]; return id?mgrById(id):null; }
function mgrBonus(m,i){ return RARITY[m.rar].b*(m.spec===i?2:1); }
function mgrMult(i){ const m=mgrOf(i); return m?1+mgrBonus(m,i):1; }
function rollRarity(w){ let r=Math.random()*w.reduce((a,b)=>a+b,0); for(let k=0;k<w.length;k++){ if(r<w[k]) return k; r-=w[k]; } return 0; }
function openCrate(type,free){ const C_=CRATES[type];
  if(S.managers.length>=MGR_MAX){ toast('Manager-Kader voll (max. 30) – verkauf erst jemanden'); return; }
  if(!free){ if(S.gold<C_.cost) return; S.gold-=C_.cost; }
  const rar=rollRarity(C_.w), m={id:'m'+(++S.mid)+Date.now()%1000, name:pick(MGR_FIRST)+' '+pick(MGR_LAST), av:pick(MGR_AV), rar, spec:Math.floor(Math.random()*FLOORS.length)};
  S.managers.push(m); save(); SFX.crate();
  modal(`<div class="crate-anim">${C_.em}</div><h2 style="color:${RARITY[rar].c}">${RARITY[rar].n}!</h2>
    <div class="mgrcard" style="--rc:${RARITY[rar].c}"><div class="mav">${m.av}</div><div><b>${m.name}</b><br><small>Spezialist: ${FLOORS[m.spec].em} ${FLOORS[m.spec].name}</small><br>
    <small>+${Math.round(RARITY[rar].b*100)} % Produktion (in der Spezial-Abteilung +${Math.round(RARITY[rar].b*200)} %)</small></div></div>
    ${S.floors[m.spec].m>0&&!S.mgrAssign[m.spec]?`<button class="btn wide gold" id="mAs">In ${FLOORS[m.spec].name} einsetzen</button>`:''}<button class="btn wide" id="mOk">Super!</button>`,
  ()=>{ $('mOk').onclick=()=>{ closeModal(); if(sheetKind) renderSheet(); }; const a=$('mAs'); if(a) a.onclick=()=>{ assignMgr(m.spec,m.id); closeModal(); }; });
}
function assignMgr(i,id){ for(const k in S.mgrAssign) if(S.mgrAssign[k]===id) delete S.mgrAssign[k]; if(id) S.mgrAssign[i]=id; else delete S.mgrAssign[i];
  renderMap(); save(); if(sheetKind) renderSheet(); if(id) toast(`👔 ${mgrById(id).name} leitet jetzt ${FLOORS[i].name}`); }
function mgrRow(m,extra){ const R=RARITY[m.rar], room=Object.keys(S.mgrAssign).find(k=>S.mgrAssign[k]===m.id);
  return `<div class="card mgr" style="--rc:${R.c}"><div class="ic" style="background:${R.c}22;box-shadow:inset 0 0 0 2px ${R.c}">${m.av}</div><div class="tx"><div class="t1">${m.name}</div>
    <div class="t2"><b style="color:${R.c}">${R.n}</b> · Spezial: ${FLOORS[m.spec].em} ${FLOORS[m.spec].name}<br>${room!=null?`Leitet: ${FLOORS[room].name} (+${Math.round(mgrBonus(m,+room)*100)} %)`:'Nicht im Einsatz'}</div></div>${extra||''}</div>`; }
function pickMgr(i){ const list=S.managers.slice().sort((a,b)=>mgrBonus(b,i)-mgrBonus(a,i)); const cur=mgrOf(i);
  modal(`<h2>👔 Manager für ${FLOORS[i].name}</h2><div style="max-height:52vh;overflow:auto;text-align:left;margin-top:8px">
    ${list.length?list.map(m=>mgrRow(m,`<button class="btn" style="min-width:0" data-pick="${m.id}">+${Math.round(mgrBonus(m,i)*100)} %</button>`)).join(''):'<p>Noch keine Manager. Öffne eine Manager-Kiste im Imperium-Menü!</p>'}</div>
    ${cur?'<button class="btn wide red" id="mRm">Manager abziehen</button>':''}<button class="btn wide" id="mCl">Schließen</button>`,
  ()=>{ document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ assignMgr(i,b.dataset.pick); closeModal(); }); $('mCl').onclick=closeModal; const rm=$('mRm'); if(rm) rm.onclick=()=>{ assignMgr(i,null); closeModal(); }; }); }
function managerCardForFloor(i){ const m=mgrOf(i);
  return m?`<div class="card mgr" style="--rc:${RARITY[m.rar].c}"><div class="ic" style="background:${RARITY[m.rar].c}22;box-shadow:inset 0 0 0 2px ${RARITY[m.rar].c}">${m.av}</div><div class="tx"><div class="t1">Manager: ${m.name}</div>
      <div class="t2"><b style="color:${RARITY[m.rar].c}">${RARITY[m.rar].n}</b> · Produktion <b>+${Math.round(mgrBonus(m,i)*100)} %</b>${m.spec===i?' (Spezialist ×2)':''}</div></div><button class="btn blue" id="bMg" style="min-width:0">Wechseln</button></div>`
   :`<div class="card"><div class="ic">👔</div><div class="tx"><div class="t1">Kein Manager</div><div class="t2">Ein Manager steigert die Produktion dieser Abteilung deutlich.</div></div><button class="btn blue" id="bMg" style="min-width:0">Zuweisen</button></div>`; }
function renderManagers(head){
  let h=head+`<div class="info"><p>Manager bleiben <b>für immer</b> – auch nach Produktwechsel und Neugründung. Jeder Manager steigert die Produktion einer Abteilung; in seiner <b>Spezial-Abteilung doppelt</b>.</p></div><div class="sect">Kisten</div>`;
  for(const k in CRATES){ const C_=CRATES[k]; h+=`<div class="card"><div class="ic">${C_.em}</div><div class="tx"><div class="t1">${C_.n}</div><div class="t2">${C_.w.map((w,j)=>w?`<span style="color:${RARITY[j].c};font-weight:800">${RARITY[j].n} ${w} %</span>`:'').filter(Boolean).join(' · ')}</div></div>
    <button class="btn gold" data-crate="${k}" ${S.gold<C_.cost?'disabled':''}>Öffnen<small>${C_.cost} 🪙</small></button></div>`; }
  h+=`<div class="sect"><span>Dein Kader · ${S.managers.length}/${MGR_MAX}</span></div>`;
  if(!S.managers.length) h+=`<div class="info"><p>Noch keine Manager. Öffne deine erste Kiste!</p></div>`;
  S.managers.slice().sort((a,b)=>b.rar-a.rar).forEach(m=>h+=mgrRow(m,`<button class="btn ghost" data-sell="${m.id}">Abfindung<br>+${RARITY[m.rar].sell} 🪙</button>`));
  BD().innerHTML=h;
  BD().querySelectorAll('[data-crate]').forEach(b=>b.onclick=()=>openCrate(b.dataset.crate));
  BD().querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{ const m=mgrById(b.dataset.sell);
    modal(`<div class="em">${m.av}</div><h2>${m.name} entlassen?</h2><p>Du erhältst eine Abfindung von <b>${RARITY[m.rar].sell} 🪙</b>.</p><button class="btn wide red" id="mY">Entlassen</button><button class="btn wide" id="mN">Behalten</button>`,
      ()=>{ $('mN').onclick=closeModal; $('mY').onclick=()=>{ for(const k in S.mgrAssign) if(S.mgrAssign[k]===m.id) delete S.mgrAssign[k]; S.managers=S.managers.filter(x=>x!==m); S.gold+=RARITY[m.rar].sell; closeModal(); renderMap(); save(); renderSheet(); }; }); });
}

// ---------- 5) Events ----------
const EVENTS=[
  {id:'fest',  em:'🎉', n:'Festival in Berlin',         d:'Spätis & Kioske zahlen doppelt so viel pro Dose', mins:8, contract:c=>['spaeti','kiosk'].includes(c.shop)?2:1},
  {id:'heat',  em:'☀️', n:'Hitzewelle',                 d:'Läden mit Wunschsorte Mint oder Wintergreen zahlen doppelt', mins:8, contract:c=>[1,2].includes(c.flavor)?2:1},
  {id:'bf',    em:'🛍️', n:'Black Friday',               d:'Alle Preise +50 %', mins:6, price:1.5},
  {id:'hype',  em:'🤳', n:'Influencer-Hype',            d:'Dein Onlineshop verkauft 3× so viel', mins:8, online:3, need:()=>S.online>0},
  {id:'short', em:'⚠️', n:'Lieferengpass Rohtabak',     d:'Produktion −30 % – aber der Packtisch bringt das 5-Fache', mins:5, prod:.7, pack:5},
  {id:'raid',  em:'📋', n:'Kontrolle vom Ordnungsamt',  d:'+15 % Abgabe, solange die Abhängigkeit über 40 % liegt', mins:5, tax:.15},
  {id:'expo',  em:'🎪', n:'Fachmesse in Stockholm',     d:'Produktion +50 %', mins:8, prod:1.5},
  {id:'rush',  em:'💸', n:'Geldregen',                  d:'Doppelt so viele & doppelt so große Geldbündel', mins:5, coin:2},
];
function evNow(){ return S.event && Date.now()<S.event.until ? EVENTS.find(e=>e.id===S.event.id) : null; }
const eventProd=()=>{ const e=evNow(); return e&&e.prod||1; };
const eventPrice=()=>{ const e=evNow(); return e&&e.price||1; };
const eventContract=c=>{ const e=evNow(); return e&&e.contract?e.contract(c):1; };
const eventOnline=()=>{ const e=evNow(); return e&&e.online||1; };
const eventTax=()=>{ const e=evNow(); return e&&e.tax&&S.index>TAX_FREE?e.tax:0; };
const eventPack=()=>{ const e=evNow(); return e&&e.pack||1; };
const eventCoin=()=>{ const e=evNow(); return e&&e.coin||1; };
function tickEvents(){
  if(!S.onboarded||handPhase()||S.lifetime<3000) return;
  const now=Date.now(); if(!S.eventNext) S.eventNext=now+rnd(4,8)*60000;
  if(!evNow() && now>S.eventNext){ const pool=EVENTS.filter(e=>!e.need||e.need()); const e=pick(pool); S.event={id:e.id,until:now+e.mins*60000}; SFX.whoosh(); S.eventNext=S.event.until+rnd(12,25)*60000;
    if(e.coin) coinNext=8; renderMap(); save();
    modal(`<div class="em">${e.em}</div><h2>${e.n}</h2><p>${e.d}</p><p style="font-size:13px">Läuft ${e.mins} Minuten</p><button class="btn wide gold" id="mOk">Los geht's!</button>`,()=>$('mOk').onclick=closeModal); }
  const el=$('evBar'), e=evNow(); if(e){ el.classList.add('on'); el.textContent=`${e.em} ${e.n} · noch ${fmtTime((S.event.until-now)/1000)}`; } else el.classList.remove('on');
}
$('evBar').onclick=()=>{ const e=evNow(); if(e) toast(`${e.em} ${e.d}`); };

// ---------- Spielschleife ----------
function earn(x){ S.money+=x; S.lifetime+=x; S.earnedTier+=x; }
let lastT=performance.now(), slow=0, truckTimer=0, sheetTick=0;
function frame(now){
  const dt=Math.min(1,(now-lastT)/1000); lastT=now;
  if(S.onboarded){
    earn(income()*dt);
    S.index += (idxTarget()-S.index)*Math.min(1,dt/90);
    if(taxRate()>0 && !S.taxWarned){ S.taxWarned=true; toast('🏛️ Regulierung: Der Staat erhebt eine Sonderabgabe!'); }
  }
  updateHUD(); tickCoins(dt); drawWorld(dt);
  slow+=dt; truckTimer+=dt; droneTimer+=dt;
  if(slow>0.25){ slow=0; updateMap(); updateBadges(); updateProfile(); if(S.onboarded) updatePacker(); tickEvents(); updateMission();
    if(!dailyShown && S.onboarded && !handPhase() && !$('modal').classList.contains('on') && dailyState().avail){ dailyShown=true; setTimeout(()=>{ if(!$('modal').classList.contains('on')) showDaily(); else dailyShown=false; },600); }
    if(!handPhase() && S.onboarded && Date.now()>S.offerAt) refreshOffers();
    sheetTick++; if(sheetKind && sheetKind!=='mehr' && sheetKind!=='profil' && sheetTick%4===0 && !$('modal').classList.contains('on') && !document.activeElement.matches('input,textarea')) renderSheet(); }
  if(truckTimer>Math.max(4,11-(S.fleetLv||0)*.6)){ truckTimer=0; if(prodRate()>0) sendTruck(); }
  if(droneTimer>droneNext && !droneActive && !sheetKind && S.onboarded && !handPhase()){ droneTimer=0; droneNext=40+Math.random()*50; spawnDrone(); }
  requestAnimationFrame(frame);
}
function updateBadges(){
  const hp=handPhase();
  $('bCon').classList.toggle('on', !hp && S.contracts.length<slots() && S.offers.length>0);
  $('bSort').classList.toggle('on', !hp && (BRANDS.some(b=>!hasBrand(b.id)&&!(b.needStr&&S.str<b.needStr)&&S.money>=b.cost) ||
    FLAVORS.some((f,k)=>!hasFlavor(k)&&FLAVORS.slice(0,k).every((_,j)=>hasFlavor(j))&&S.money>=f.c) ||
    (STRENGTHS[S.str+1]&&S.money>=STRENGTHS[S.str+1].cost)));
  $('bExp').classList.toggle('on', !hp && ((REGIONS[S.regions]&&S.money>=REGIONS[S.regions].cost) || (!S.online&&S.money>=ONLINE.unlock) || (S.online&&S.online<ONLINE.max&&S.money>=ONLINE.cost(S.online))));
  $('bImp').classList.toggle('on', (S.tier<PRODUCTS.length-1 && S.earnedTier>=PRODUCTS[S.tier].req) || RESEARCH.some(r=>rl(r.id)<r.max && S.gold>=r.cost(rl(r.id))) || potStars()>=Math.max(1,S.stars) || (!hp && S.gold>=CRATES.std.cost && S.managers.length<MGR_MAX));
}

// ---------- Speichern / Laden ----------
function hydrate(d){
  const s=Object.assign(freshState(),d);
  s.floors=FLOORS.map((_,i)=>Object.assign({m:0,p:0,a:0},d.floors&&d.floors[i]));
  s.research=d.research||{}; s.lvl=Math.max(s.lvl||1,1); s.managers=Array.isArray(d.managers)?d.managers:[]; s.mgrAssign=d.mgrAssign||{}; s.store=Object.assign(freshStore(),d.store||{}); s.store.d=ST_DEPTS.map((_,i)=>Object.assign({l:0,s:0},(d.store&&d.store.d||[])[i]));
  if(!Array.isArray(s.brands)||!s.brands.length) s.brands=['haus'];
  if(!Array.isArray(s.flavors)||!s.flavors.length) s.flavors=[0];
  if(d.fleetLv==null&&d.onboarded) s._mig=1; if(!Array.isArray(s.citiesOpen)||!s.citiesOpen.length) s.citiesOpen=[0]; s.cdata=d.cdata||{}; s.ach=d.ach||{}; s.mk=d.mk||{}; s.camp=d.camp||{}; s.qual=d.qual||{}; if(!d.qual&&d.onboarded) s._qmig=1; s.snd=Object.assign({m:.35,s:.7},d.snd||{});
  return s;
}
function save(){ S.last=Date.now(); try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); if(r){ S=hydrate(JSON.parse(r)); return true; } }catch(e){} return false; }
function offline(){
  if(!S.onboarded) return;
  const away=(Date.now()-S.last)/1000; if(away<15) return;
  const secs=Math.min(offlineCap(),away), base=income()/boostX();
  const boostSecs=Math.max(0,Math.min(secs,(S.boostUntil-S.last)/1000));
  const gain=base*secs+base*(S.boostMult-1)*boostSecs;
  S.index += (idxTarget()-S.index)*Math.min(1,secs/90);
  if(gain<=0) return;
  earn(gain);
  modal(`<div class="em">🌙</div><h2>Willkommen zurück!</h2><p>${esc(S.company)} hat ${fmtTime(away)} weiterproduziert und geliefert.</p>
    <div class="reward">+${eur(gain)}</div>${away>secs?`<p style="font-size:13px">Angerechnet: max. ${fmtTime(secs)} – mehr mit Forschung „Nachtschicht"</p>`:''}
    <button class="btn wide" id="mOk">Einsammeln</button>`, ()=>$('mOk').onclick=closeModal);
}
function scrollBottom(){ centerCam(); }

document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else { offline(); lastT=performance.now(); } });
window.addEventListener('pagehide',save);
setInterval(()=>{ if(S.onboarded) save(); },5000);
window.addEventListener('resize',()=>{ resizeCanvas(); clampCam(); });


// ---------- Eigene Webadresse: App-Installation (PWA) ----------
(function(){ const h=location.hostname; if(location.protocol!=='https:'||/claude|anthropic/.test(h)) return;
  const add=(rel,href,extra)=>{ const l=document.createElement('link'); l.rel=rel; l.href=href; if(extra) Object.assign(l,extra); document.head.appendChild(l); };
  add('manifest','manifest.webmanifest'); add('apple-touch-icon','icon-180.png'); add('icon','icon-192.png',{type:'image/png'});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); })();

// ---------- Start ----------
load(); migrate6(); resizeCanvas(); centerCam(); if(S.gfx&&S.gfx!=='hoch') setTimeout(applyGfx,50);
{ const mo=document.querySelector('.hud .money'), hr=document.querySelector('.hud .hrow'); hr.insertBefore(mo,hr.querySelector('.res')); }
$('cWh').onclick=openLager; $('hudT').onclick=()=>{ setHudMin(!S.hudMin); save(); }; setHudMin(S.hudMin!==false); $('cTime').onclick=openCities; $('ordBar').onclick=openLager;
renderMap(); updateHUD(); updateMap(); updateProfile(); scrollBottom(); buildCan();
if(!S.onboarded) onboarding(); else { if(handPhase()) openPacker(); else updatePacker(); offline(); }
requestAnimationFrame(frame);
</script>
